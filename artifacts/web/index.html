<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SureBet — Game Intelligence</title>
    <meta name="description" content="Probabilistic match predictions, value signals, and arbitrage analysis." />
    <script>
      // Applied synchronously, before first paint, so a returning dark-mode
      // user doesn't see a flash of the light default. Light itself needs no
      // attribute (it's the CSS default), so this only ever sets "dark".
      try {
        if (localStorage.getItem("surebet.theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark")
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
